server {
    listen      8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # /api/* goes to the API container. The SPA therefore makes same-origin
    # requests, needs no CORS handling, and carries no API host in its bundle.
    # The trailing slash on proxy_pass strips the /api prefix, so /api/invoices
    # arrives at the backend as /invoices.
    location /api/ {
        proxy_pass         http://api:4000/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # Vite fingerprints these filenames, so they can be cached forever.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html must never be cached, or a browser keeps asking for the
    # previous deploy's asset names after an update.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Client-side routing: unknown paths go to the SPA instead of 404ing, so a
    # deep link like /invoices/<id> survives a refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
